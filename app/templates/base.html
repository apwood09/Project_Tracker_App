<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.index') }}">{{ app_name }}</a>
    <nav>
      <a href="{{ url_for('main.index') }}">Home</a>
      <a href="{{ url_for('main.about') }}">About</a>

      {% if current_user.is_authenticated %}
        <span class="user-welcome">Hello, {{ current_user.username}}!</span>
        <a href="#" id="nav-logout" class="nav-link-logout">Log Out</a>
      {% else %}
        <a href="{{ url_for('main.login_page') }}">Log In</a>
        <a href="{{ url_for('main.register_page') }}">Sign Up</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <small>&copy; {{ app_name }}</small>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const logoutLink = document.getElementById("nav-logout"); 
      if (logoutLink) {
        logoutLink.addEventListener("click", async (e) => {
          e.preventDefault(); 
          try {
            const response = await fetch ("/api/logout", {method: "POST"}); 
            if (response.ok) {
              window.location.reload(); // refresh page update nav links
            }
          } catch (error) {
            console.error("Logout failed:", error); 
          }
        }); 
      }
    }); 
  </script>
</body>
</html>
